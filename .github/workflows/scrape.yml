name: scrape

on:
  schedule:
    - cron: "30 0 * * *" # 06:00 Asia/Colombo
  workflow_dispatch:
    inputs:
      banks:
        description: "Comma-separated bank ids (e.g. hnb,ntb). Empty = all banks."
        required: false
        default: ""

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    # Runs on your own machine (a GitHub self-hosted runner). Several banks return
    # 403 to cloud/data-centre IPs such as GitHub's hosted runners, so the scrape
    # has to run from a normal Sri Lankan connection. See README "Self-hosted runner".
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium for the DFCC and Sampath scrapers
        # Browsers are cached on the runner machine, so this is quick after the first run.
        run: npx playwright install chromium

      - name: Scrape banks and email users
        run: npm run worker -- --once
        env:
          SCRAPE_BANKS: ${{ github.event.inputs.banks }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DATABASE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          APP_URL: ${{ secrets.APP_URL }}
